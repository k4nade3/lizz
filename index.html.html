
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Lyrics</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      background: #f7f8fc;
      font-family: Georgia, serif;
      color: #173778;
    }

    #lyric-area {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* LYRIC BOX */
    .lyric-box {
      position: absolute;
      left: 50%;
      top: var(--start-y, 100%);
      z-index: 2;
      transform: translateX(-50%);

      width: 120px;
      height: 120px;

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 10px;
      overflow: hidden;

      color: white;
      background: #173778;
      border: 1px solid white;
      border-radius: 2px;

      box-shadow: 0 8px 25px rgba(23, 55, 120, 0.12);

      opacity: 0;
      animation: floatUp 12s linear forwards;
    }

    .lyric-text {
      display: block;
      max-width: 100%;
      font-size: clamp(10px, 1.6vw, 14px);
      line-height: 1.4;
      letter-spacing: 0.15px;
      text-align: center;
      overflow-wrap: anywhere;
      word-break: break-word;
      hyphens: auto;
      overflow: hidden;
    }

    .italic {
      font-style: italic;
    }

    .bold {
      font-weight: bold;
    }

    .bold-italic {
      font-weight: bold;
      font-style: italic;
    }

    /* PHOTO BOX */
    .photo-box {
      position: absolute;
      left: 50%;
      top: var(--start-y, 100%);
      z-index: 1;
      transform: translateX(-50%);

      width: 120px;
      height: 120px;

      padding: 7px;
      background: white;
      border: 1px solid #dce3f2;
      box-shadow: 0 8px 25px rgba(23, 55, 120, 0.12);

      opacity: 0;
      animation: photoFloat 10s linear forwards;
    }

    .photo-box img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ANIMATIONS */
    @keyframes floatUp {
      0% {
        top: var(--start-y, 100%);
        opacity: 0;
      }

      8% {
        opacity: 1;
      }

      70% {
        opacity: 1;
      }

      100% {
        top: -250px;
        opacity: 0;
      }
    }

    @keyframes photoFloat {
      0% {
        top: var(--start-y, 100%);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      75% {
        opacity: 1;
      }

      100% {
        top: -220px;
        opacity: 0;
      }
    }

    @keyframes envelopeAppear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUpPanel {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* START BUTTON */
    #start-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      padding: 12px 30px;
      border: 1px solid #173778;
      border-radius: 2px;

      background: white;
      color: #173778;

      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 2px;

      cursor: pointer;
      transition: 0.3s;
    }

    #start-button:hover {
      background: #173778;
      color: white;
    }

    #start-button.hidden {
      display: none;
    }

    .envelope-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(255, 255, 255, 0.2);
      opacity: 0;
      transform: translateY(18px);
      animation: envelopeAppear 0.8s ease-out forwards;
    }

    .white-envelope {
      position: relative;
      width: min(72vw, 360px);
      height: 220px;
      background: #ffffff;
      border: 1px solid rgba(23, 55, 120, 0.12);
      border-radius: 18px;
      box-shadow: 0 18px 35px rgba(23, 55, 120, 0.12);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.75s ease, box-shadow 0.75s ease;
    }

    .white-envelope::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 55%;
      background: linear-gradient(135deg, #f5f7fb, #edf1f8);
      clip-path: polygon(0 0, 50% 60%, 100% 0);
      border-bottom: 1px solid rgba(23, 55, 120, 0.08);
      transform-origin: top center;
      transition: transform 0.8s ease;
    }

    .white-envelope::after {
      content: "";
      position: absolute;
      inset: 18px 18px 18px 18px;
      border: 1px solid rgba(23, 55, 120, 0.1);
      border-radius: 12px;
    }

    .white-envelope.opened {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 24px 42px rgba(23, 55, 120, 0.16);
    }

    .white-envelope.opened::before {
      transform: rotateX(180deg);
    }

    .envelope-tag {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #173778;
      transition: opacity 0.45s ease;
    }

    .white-envelope.opened .envelope-tag {
      opacity: 0;
    }

    .food-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(2px);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.9s ease forwards;
    }

    .food-panel {
      width: min(72vw, 560px);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(23, 55, 120, 0.08);
      border-radius: 26px;
      box-shadow: 0 20px 40px rgba(23, 55, 120, 0.12);
      padding: 26px 24px 20px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUpPanel 0.8s ease 0.15s forwards;
    }

    .food-title {
      margin-bottom: 18px;
      text-align: center;
      font-size: clamp(24px, 4vw, 38px);
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #173778;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .food-option {
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(23, 55, 120, 0.08);
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(23, 55, 120, 0.08);
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .food-option:hover {
      transform: translateY(-2px);
    }

    .food-option img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .food-label {
      margin-top: 10px;
      text-align: center;
      color: #173778;
      font-size: 15px;
      font-weight: 600;
    }

    .restart-button {
      margin-top: 18px;
      padding: 10px 22px;
      border: 1px solid #173778;
      border-radius: 999px;
      background: white;
      color: #173778;
      font-family: Georgia, serif;
      font-size: 14px;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .restart-button:hover {
      background: #173778;
      color: white;
    }

    @media (max-width: 600px) {
      .lyric-box {
        width: 110px;
        height: 110px;
      }

      .photo-box {
        width: 100px;
        height: 100px;
      }

      .lyric-text {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div id="lyric-area"></div>
  <button id="start-button">START</button>
  <audio id="bgm" preload="auto"></audio>

  <script>
    // LYRICS
    const lyrics = [
      { text: "Looking for attention, 너야겠어 ", style: "" },
      { text: "확실하게 나로 만들겠어 ", style: "" },
      { text: "Ayy, drop the question", style: "italic" },
      { text: "Drop the, drop the question ", style: "italic" },
      { text: "Want attention, wanna, want attention ", style: "bold" },
      { text: "You give me butterflies, you know?", style: "bold-italic" },
      { text: "내 맘은 온통 paradise", style: "bold-italic" },
      { text: "꿈에서 깨워주지 마 ", style: "italic" },
      { text: "You got me looking for attention", style: "bold-italic" }
    ];

    // PHOTO FILES
    const photos = [
      "food.jpg.jpeg",
      "ew1.jpeg.jpeg",
      "cheescake1.Jjpeg.jpeg",
      "ew2.jpeg.jpeg"
    ];

    const swapPhotoMap = {
      "food.jpg.jpeg": "food3.jpg.jpeg",
      "cheescake1.Jjpeg.jpeg": "food4.jpg.jpeg"
    };

    const bgm = document.getElementById("bgm");
    bgm.loop = false;
    let envelopeShown = false;

    function startFadeOut() {
      const fadeDuration = 3500;
      const step = 0.05;
      const intervalMs = 120;

      const fadeInterval = setInterval(() => {
        if (bgm.volume > 0.05) {
          bgm.volume = Math.max(0, Number((bgm.volume - step).toFixed(2)));
        } else {
          bgm.pause();
          bgm.currentTime = 0;
          clearInterval(fadeInterval);
        }
      }, intervalMs);

      setTimeout(() => {
        clearInterval(fadeInterval);
        bgm.pause();
        bgm.currentTime = 0;
      }, fadeDuration);
    }

    const lyricPositions = [
      { x: -120, y: 620 },
      { x: -90,  y: 700 },
      { x: 80,   y: 620 },
      { x: 20,  y: 680 },
      { x: -50, y: 650 },
      { x: 70,  y: 720 },
      { x: 0,    y: 600 },
      { x: -60,  y: 680 },
      { x: -120,  y: 650 }
    ];

    const photoPositions = [
      { x: 40, y: 600 },
      { x: -70,  y: 600 },
      { x: -120, y: 600 },
      { x: 50,  y: 620 }
    ];

    const area = document.getElementById("lyric-area");
    const button = document.getElementById("start-button");

    let started = false;
    let timers = [];

    function clearAllTimers() {
      timers.forEach(timer => clearTimeout(timer));
      timers = [];
    }

    // TYPEWRITER EFFECT
    function typeText(element, text, speed = 85) {
      const characters = Array.from(text);
      let index = 0;

      function typeNext() {
        if (index < characters.length) {
          element.textContent += characters[index];
          index++;
          setTimeout(typeNext, speed);
        }
      }

      typeNext();
    }

    // CREATE LYRIC BOX
    function createLyric(lyric, index) {
      const box = document.createElement("div");
      box.className = "lyric-box";

      const pos = lyricPositions[index];

      box.style.left = `calc(50% + ${pos.x}px)`;
      box.style.setProperty("--start-y", pos.y + "px");

      const text = document.createElement("span");
      text.className = "lyric-text";

      if (lyric.style) {
        text.classList.add(lyric.style);
      }

      box.appendChild(text);
      area.appendChild(box);

      typeText(text, lyric.text, 85);
    }

    // CREATE PHOTO BOX
    function createPhoto(fileName, index) {
      const box = document.createElement("div");
      box.className = "photo-box";

      const pos = photoPositions[index];

      box.style.left = `calc(50% + ${pos.x}px)`;
      box.style.setProperty("--start-y", pos.y + "px");

      const img = document.createElement("img");
      img.src = "./" + fileName;
      img.alt = "Floating photo";
      img.dataset.originalSrc = fileName;

      if (swapPhotoMap[fileName]) {
        img.style.cursor = "pointer";
        img.addEventListener("click", () => {
          const isSwapped = img.dataset.swapped === "true";
          img.dataset.swapped = String(!isSwapped);
          img.src = "./" + (isSwapped ? fileName : swapPhotoMap[fileName]);
        });
      }

      img.onerror = function () {
        console.error("Image not found:", fileName);
        box.remove();
      };

      box.appendChild(img);
      area.appendChild(box);
    }

    function resetToStart() {
      clearAllTimers();
      area.innerHTML = "";
      started = false;
      envelopeShown = false;
      bgm.pause();
      bgm.currentTime = 0;
      button.classList.remove("hidden");
      button.textContent = "START";
    }

    function showEnvelope() {
      envelopeShown = true;
      area.innerHTML = "";

      const stage = document.createElement("div");
      stage.className = "envelope-stage";

      const envelope = document.createElement("div");
      envelope.className = "white-envelope";

      const tag = document.createElement("div");
      tag.className = "envelope-tag";
      tag.textContent = "CLICK";

      envelope.appendChild(tag);
      envelope.addEventListener("click", () => {
        envelope.classList.add("opened");
        setTimeout(() => showFoodOverlay(), 380);
      });
      stage.appendChild(envelope);
      area.appendChild(stage);
      button.classList.add("hidden");
    }

    function showFoodOverlay() {
      area.innerHTML = "";

      const overlay = document.createElement("div");
      overlay.className = "food-overlay";

      const panel = document.createElement("div");
      panel.className = "food-panel";

      const title = document.createElement("div");
      title.className = "food-title";
      title.textContent = "Makan apa yahh";

      const grid = document.createElement("div");
      grid.className = "food-grid";

      const images = [
        { src: "berry2.jpg.jpeg", alt: "Berry 2" },
        { src: "mcd.jpg.jpeg", alt: "McD" },
        { src: "tomat.jpg.jpeg", alt: "Tomat" },
        { src: "chicken.jpg.jpeg", alt: "Chicken" }
      ];

      images.forEach((image) => {
        const card = document.createElement("div");
        card.className = "food-option";
        card.addEventListener("click", () => {
          if (image.src.includes("berry2")) {
            showFinalFoodOverlay("miffy is cute but berries..");
          } else if (image.src.includes("mcd")) {
            showMcdOverlay();
          } else if (image.src.includes("tomat")) {
            showFinalFoodOverlay("tomato");
          } else if (image.src.includes("chicken")) {
            showFinalFoodOverlay("american food type:");
          }
        });

        const img = document.createElement("img");
        img.src = "./" + image.src;
        img.alt = image.alt;

        card.appendChild(img);
        grid.appendChild(card);
      });

      panel.appendChild(title);
      panel.appendChild(grid);
      overlay.appendChild(panel);
      area.appendChild(overlay);
    }

    function showFinalFoodOverlay(text = "miffy is cute but berries..") {
      area.innerHTML = "";

      const overlay = document.createElement("div");
      overlay.className = "food-overlay";

      const panel = document.createElement("div");
      panel.className = "food-panel";

      const title = document.createElement("div");
      title.className = "food-title";
      title.textContent = text;

      const imageWrap = document.createElement("div");
      imageWrap.style.display = "flex";
      imageWrap.style.justifyContent = "center";
      imageWrap.style.margin = "20px 0";

      const fairyImg = document.createElement("img");
      fairyImg.src = "./fairy.jpg.jpeg";
      fairyImg.alt = "Fairy";
      fairyImg.style.width = "220px";
      fairyImg.style.maxWidth = "70vw";
      fairyImg.style.borderRadius = "18px";
      fairyImg.style.objectFit = "cover";
      imageWrap.appendChild(fairyImg);

      const restartButton = document.createElement("button");
      restartButton.className = "restart-button";
      restartButton.textContent = "RESTART";
      restartButton.addEventListener("click", resetToStart);

      panel.appendChild(title);
      panel.appendChild(imageWrap);
      panel.appendChild(restartButton);
      overlay.appendChild(panel);
      area.appendChild(overlay);
    }

    function showMcdOverlay() {
      area.innerHTML = "";

      const overlay = document.createElement("div");
      overlay.className = "food-overlay";

      const panel = document.createElement("div");
      panel.className = "food-panel";

      const title = document.createElement("div");
      title.className = "food-title";
      title.textContent = "i want one";

      const imageWrap = document.createElement("div");
      imageWrap.style.display = "flex";
      imageWrap.style.justifyContent = "center";
      imageWrap.style.margin = "20px 0";

      const itemImg = document.createElement("img");
      itemImg.src = "./uni.jpg.jpeg";
      itemImg.alt = "Uni";
      itemImg.style.width = "220px";
      itemImg.style.maxWidth = "70vw";
      itemImg.style.borderRadius = "18px";
      itemImg.style.objectFit = "cover";
      imageWrap.appendChild(itemImg);

      const actionButton = document.createElement("button");
      actionButton.className = "restart-button";
      actionButton.textContent = "𐔌՞ ܸ.ˬ.ܸ՞𐦯";
      actionButton.addEventListener("click", showSundayOverlay);

      panel.appendChild(title);
      panel.appendChild(imageWrap);
      panel.appendChild(actionButton);
      overlay.appendChild(panel);
      area.appendChild(overlay);
    }

    function showSundayOverlay() {
      area.innerHTML = "";

      const overlay = document.createElement("div");
      overlay.className = "food-overlay";

      const panel = document.createElement("div");
      panel.className = "food-panel";

      const title = document.createElement("div");
      title.className = "food-title";
      title.textContent = "happy sunday";
      title.style.fontSize = "clamp(15px, 2vw, 23px)";
      title.style.lineHeight = "1.3";

      const imageWrap = document.createElement("div");
      imageWrap.style.display = "flex";
      imageWrap.style.justifyContent = "center";
      imageWrap.style.margin = "20px 0";

      const itemImg = document.createElement("img");
      itemImg.src = "./sunday.jpg.jpeg";
      itemImg.alt = "Sunday";
      itemImg.style.width = "220px";
      itemImg.style.maxWidth = "70vw";
      itemImg.style.borderRadius = "18px";
      itemImg.style.objectFit = "cover";
      imageWrap.appendChild(itemImg);

      const backButton = document.createElement("button");
      backButton.className = "restart-button";
      backButton.textContent = "BACK";
      backButton.addEventListener("click", resetToStart);

      panel.appendChild(title);
      panel.appendChild(imageWrap);
      panel.appendChild(backButton);
      overlay.appendChild(panel);
      area.appendChild(overlay);
    }

    // START ANIMATION
    function startAnimation() {
      if (started) return;

      started = true;
      button.classList.add("hidden");
      clearAllTimers();

      bgm.src = "attention.mp3.mp4";
      bgm.load();
      bgm.volume = 0.45;
      bgm.play().catch(() => {
        console.log("Klik tombol sudah benar untuk mulai musik.");
      });

      if (Number.isFinite(bgm.duration)) {
        const fadeAt = Math.max(0, bgm.duration - 5);
        timers.push(setTimeout(() => {
          if (!bgm.paused) {
            startFadeOut();
          }
        }, fadeAt * 1000));
      }

      // Kamu yang atur waktunya sendiri di sini (dalam milidetik)
      const lyricDelays = [
        0, 2500, 4000, 5000, 7000,
        9000, 12000, 14000, 17000
      ];

      // Kamu yang atur waktu foto muncul sendiri (dalam milidetik)
      const photoDelays = [
        1000, 10000, 13000, 17000
      ];

      lyrics.forEach((lyric, index) => {
        timers.push(setTimeout(() => {
          createLyric(lyric, index);
        }, lyricDelays[index]));
      });

      photos.forEach((photo, index) => {
        timers.push(setTimeout(() => {
          createPhoto(photo, index);
        }, photoDelays[index]));
      });

      timers.push(setTimeout(() => {
        bgm.pause();
        bgm.currentTime = 0;
      }, 28000));

      timers.push(setTimeout(() => {
        showEnvelope();
      }, 28000));
    }

    button.addEventListener("click", startAnimation);
  </script>

</body>
</html>
